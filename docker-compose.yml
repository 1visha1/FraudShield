services:
  postgres:
    image: postgres:16
    container_name: securepay-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: securepay
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - securepay-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    container_name: securepay-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - securepay-network
    healthcheck:
      # More robust healthcheck: check Redis version to ensure Streams are supported
      test: ["CMD", "redis-cli", "INFO", "server", "|", "grep", "redis_version:7"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: securepay-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - securepay-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: securepay-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - securepay-network
    healthcheck:
      test: ["CMD", "curl", "-s", "-f", "http://localhost:9200/_cluster/health"]
      interval: 30s
      timeout: 10s
      retries: 10

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    container_name: securepay-kibana
    restart: unless-stopped
    depends_on:
      elasticsearch:
        condition: service_started
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    networks:
      - securepay-network

  discovery-service:
    build:
      context: ./discovery-service
    container_name: discovery-service
    ports:
      - "8761:8761"
    environment:
      EUREKA_HOSTNAME: discovery-service
    networks:
      - securepay-network

  authorization-server:
    build:
      context: ./authorization-server
    container_name: authorization-server
    ports:
      - "9000:9000"
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_started
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/securepay?options=-c%20timezone=UTC
      EUREKA_URL: http://discovery-service:8761/eureka/
    networks:
      - securepay-network

  api-gateway:
    build:
      context: ./api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    depends_on:
      discovery-service:
        condition: service_started
      authorization-server:
        condition: service_started
    environment:
      EUREKA_URL: http://discovery-service:8761/eureka/
      JWK_SET_URI: http://authorization-server:9000/oauth2/jwks
    networks:
      - securepay-network

  device-auth-service:
    build:
      context: ./device-auth-service
    container_name: device-auth-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      discovery-service:
        condition: service_started
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/securepay
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      EUREKA_URL: http://discovery-service:8761/eureka/
    networks:
      - securepay-network

  transaction-service:
    build:
      context: ./transaction-service
    container_name: transaction-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      discovery-service:
        condition: service_started
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/securepay
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      EUREKA_URL: http://discovery-service:8761/eureka/
    networks:
      - securepay-network

  risk-engine-service:
    build:
      context: ./risk-engine-service
    container_name: risk-engine-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      discovery-service:
        condition: service_started
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/securepay
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      EUREKA_URL: http://discovery-service:8761/eureka/
    networks:
      - securepay-network

  rule-engine-service:
    build:
      context: ./rule-engine-service
    container_name: rule-engine-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      discovery-service:
        condition: service_started
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/securepay
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      EUREKA_URL: http://discovery-service:8761/eureka/
    networks:
      - securepay-network

  fraud-engine-service:
    build:
      context: ./fraud-engine-service
    container_name: fraud-engine-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      discovery-service:
