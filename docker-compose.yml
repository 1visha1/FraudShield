    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/securepay
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      EUREKA_URL: http://discovery-service:8761/eureka/
    networks:
      - securepay-network

  audit-service:
    build:
      context: ./audit-service
    container_name: audit-service
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_started
      discovery-service:
        condition: service_started
    environment:
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      ELASTICSEARCH_HOST: elasticsearch
      EUREKA_URL: http://discovery-service:8761/eureka/
    networks:
      - securepay-network

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  elasticsearch-data:

networks:
  securepay-network:
    driver: bridge
