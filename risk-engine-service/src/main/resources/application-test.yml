spring:
  application:
    name: risk-engine-service

  cloud:
    config:
      enabled: false

  config:
    import: ""

  datasource:
    url: jdbc:h2:mem:riskdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false

  sql:
    init:
      mode: never

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

    listener:
      simple:
        auto-startup: false

  data:
    redis:
      repositories:
        enabled: false
      host: localhost
      port: 6379

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

management:
  endpoints:
    enabled-by-default: false

logging:
  level:
    root: WARN
    org.springframework: WARN

---
# Disable Flyway if present
spring:
  config:
    activate:
      on-profile: test

  flyway:
    enabled: false

---
# Disable Liquibase if present
spring:
  config:
    activate:
      on-profile: test

  liquibase:
    enabled: false