    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/securepay
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      EUREKA_URL: http://discovery-service:8761/eureka/
    networks:
      - securepay-network

  auth-orchestrator-service:
    build:
      context: ./auth-orchestrator-service
    container_name: auth-orchestrator-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
