server:
  port: 0

spring:
  application:
    name: audit-service-test

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        auto-startup: false
      direct:
        auto-startup: false

  data:
    redis:
      host: localhost
      port: 6379
      repositories:
        enabled: false

  elasticsearch:
    uris: http://localhost:9200

  cloud:
    config:
      enabled: false

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

logging:
  level:
    root: WARN
    org.springframework: WARN