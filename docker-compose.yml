    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/securepay
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      EUREKA_URL: http://discovery-service:8761/eureka/
    networks:
